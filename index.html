<style>

.chart-item { background: #fff; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }

var DATA = DATA_EE;

function switchPage(page) {
    if (page==='ee') DATA = DATA_EE;
    else if (page==='gas') DATA = DATA_GAS;
    else if (page==='acqua') DATA = DATA_ACQUA;
    // rebuild filter selecting ALL_SITES by default
    var f = document.getElementById('siteFilter');
    var selected = [];
    f.innerHTML='';
    var optAll=document.createElement('option'); optAll.value='all'; optAll.text='Tutte le sedi'; f.add(optAll);
    var keys = Object.keys(DATA.site_monthly||{}); for(var i=0; i<keys.length; i++) {var s=keys[i]; var opt=document.createElement('option'); opt.value=s; opt.text=s; opt.selected = false; f.add(opt);}

function formatNumber(num) { return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function formatEuro(num) { return '€ ' + formatNumber(num); }
function setLight(containerId, val, bdg) { var el = document.querySelector('#'+containerId+' .indicator'); if(!el) return; if (val < bdg) el.style.background = '#59a14f'; else if (val === bdg) el.style.background = '#F1C40F'; else el.style.background = '#e15759'; }

function buildTable(selected) {
    var table = document.getElementById('siteTable');
    var html = '<tr><th>Sede</th>' + DATA.months.map(function(m){return '<th>'+m+'</th>';}).join('') + '<th>Totale</th></tr>';
    var totalRow = new Array(DATA.months.length).fill(0);
    var totalOverall = 0;
    for(var site in DATA.summary) {
        if(selected.length==0 || selected.indexOf(site) !== -1) {
            var row = '<tr><td>' + site + '</td>';
            var sum = 0;
            for(var i=0;i<DATA.months.length;i++) {
                var val = (DATA.site_monthly[site] && DATA.site_monthly[site][i]) || 0;
                sum += val; totalRow[i] += val;
                if(i>=5) row += '<td class="red">' + formatNumber(val) + '</td>'; else row += '<td>' + formatNumber(val) + '</td>';
            }
            row += '<td>' + formatNumber(sum) + '</td></tr>';
            html += row;
            totalOverall += sum;
        }
    }
    html += '<tr><td><b>Totale</b></td>' + totalRow.map(function(val){return '<td><b>'+formatNumber(val)+'</b></td>';}).join('') + '<td><b>' + formatNumber(totalOverall) + '</b></td></tr>';
    table.innerHTML = html;
}
function buildComparison(selected) {
    var table = document.getElementById('forecastTable');
    var html = '<tr><th>Sede</th><th>Totale Consumi</th><th>Totale BDG</th><th>Delta %</th></tr>';
    for(var site in DATA.summary) {
        if(selected.length==0 || selected.indexOf(site) !== -1) {
            var cons = DATA.summary[site].cons || 0;
            var bdg = (DATA.summary[site].bdg !== undefined && DATA.summary[site].bdg !== null) ? DATA.summary[site].bdg : 1;
            var delta = (bdg === 0) ? '0.0' : ((cons - bdg)/bdg*100).toFixed(1);
            html += '<tr><td>' + site + '</td><td>' + formatNumber(cons) + '</td><td>' + formatNumber(bdg) + '</td><td>' + delta + '%</td></tr>';
        }
    }
    table.innerHTML = html;
}
function buildCostTable(selected) {

    var html = '<tr><th>Sede</th>' + DATA.months.map(function(m){return '<th>'+m+'</th>';}).join('') + '<th>Totale</th></tr>';
    var totalRow = new Array(DATA.months.length).fill(0);
    var totalOverall = 0;
    for(var site in DATA.summary) {
        if(selected.length==0 || selected.indexOf(site) !== -1) {
            var row = '<tr><td>' + site + '</td>';
            var sum = 0;
            for(var i=0;i<DATA.months.length;i++) {
                var val = (DATA.site_cost[site] && DATA.site_cost[site][i]) || 0;
                sum += val; totalRow[i] += val;
                if(i>=5) row += '<td class="red">' + formatEuro(val) + '</td>'; else row += '<td>' + formatEuro(val) + '</td>';

            html += row;

}
function buildCostComparison(selected) {
    var table = document.getElementById('costComparisonTable');

    for(var site in DATA.summary) {
        if(selected.length==0 || selected.indexOf(site) !== -1) {
            var c   = DATA.summary[site].cost || 0;
            var bdg = (DATA.summary[site].costbdg !== undefined && DATA.summary[site].costbdg !== null) ? DATA.summary[site].costbdg : 0;
            var delta = (bdg === 0) ? '0.0' : ((c - bdg)/bdg*100).toFixed(1);
            html += '<tr><td>' + site + '</td><td>' + formatEuro(c) + '</td><td>' + formatEuro(bdg) + '</td><td>' + delta + '%</td></tr>';
        }
    }
    table.innerHTML = html;

function updateSummary(selected) {
    var sumCons=0, sumBdg=0, sumCost=0, sumCostBdg=0;
    for(var s in DATA.summary) {
        if(selected.length==0 || selected.indexOf(s) !== -1) {
            sumCons    += DATA.summary[s].cons;
            sumBdg     += DATA.summary[s].bdg;
            sumCost    += DATA.summary[s].cost;
            sumCostBdg += DATA.summary[s].costbdg;
        }
    }
    document.querySelector('#sumConsContainer span').textContent = formatNumber(sumCons);
    document.querySelector('#sumBDGContainer span').textContent = formatNumber(sumBdg);
    document.querySelector('#sumCostContainer span').textContent = formatEuro(sumCost);
    document.querySelector('#sumCostBDGContainer span').textContent = formatEuro(sumCostBdg);
    setLight('sumConsContainer', sumCons, sumBdg);
    setLight('sumCostContainer', sumCost, sumCostBdg);
}
var chartCons, chartCost;
function initCharts() {
    if(typeof Chart === 'undefined') { return; }
    var ctx1 = document.getElementById('chart_cons_bdg').getContext('2d');
    chartCons = new Chart(ctx1, {
        type: 'bar', data: {labels: DATA.months, datasets: [

function updateCharts(selected) {
    var consTot = new Array(DATA.months.length).fill(0);
    var bdgTot  = new Array(DATA.months.length).fill(0);
    var costTot = new Array(DATA.months.length).fill(0);
    var costBdgTot = new Array(DATA.months.length).fill(0);
    for(var site in DATA.summary) {
        if(selected.length===0 || selected.indexOf(site) !== -1) {
            for(var i=0;i<DATA.months.length;i++) {
                consTot[i]    += DATA.site_monthly[site][i] || 0;
                bdgTot[i]     += DATA.site_bdg[site][i] || 0;
                costTot[i]    += DATA.site_cost[site][i] || 0;
                costBdgTot[i] += DATA.site_cost_bdg[site][i] || 0;
            }
        }
    }
    if(chartCons) {
        chartCons.data.datasets[0].data = consTot.map(function(x,i){return i<5 ? x : 0;});
        chartCons.data.datasets[1].data = consTot.map(function(x,i){return i>=5 ? x : 0;});
        chartCons.data.datasets[2].data = bdgTot;
        chartCons.update();
    }
    if(chartCost) {
        chartCost.data.datasets[0].data = costTot.map(function(x,i){return i<5 ? x : 0;});
        chartCost.data.datasets[1].data = costTot.map(function(x,i){return i>=5 ? x : 0;});

function handleFilterChange() {
    var f = document.getElementById('siteFilter');
    var sel = Array.from(f.selectedOptions).map(function(o){ return o.value; }).filter(function(val){ return val !== 'all' && typeof DATA.summary[val] !== 'undefined'; });
    var selected;
    if (sel.length === 0) { selected = Object.keys(DATA.summary); } else { selected = sel; }
    buildTable(selected);
    buildComparison(selected);
    buildCostTable(selected);
    buildCostComparison(selected);
    updateSummary(selected);
    updateCharts(selected);
    if (typeof attachDrillDown === 'function') attachDrillDown();
}


function attachDrillDown() {
    ['siteTable','forecastTable','costTable','costComparisonTable'].forEach(function(id) {
        var table = document.getElementById(id);
        if (!table) return;
        Array.from(table.getElementsByTagName('tr')).forEach(function(row, idx){
            if(idx === 0) return;
            row.style.cursor = 'pointer';
            row.onclick = function() {
                var site = this.cells[0].innerText;
                if (!site || site.trim() === '' || site.trim().toLowerCase().includes('totale')) return;
                var f = document.getElementById('siteFilter');
                Array.from(f.options).forEach(function(opt) {
                    opt.selected = (opt.value === site);
                });
                handleFilterChange();
            };
        });
    });
}

}
    initCharts();
    handleFilterChange();
    f.addEventListener('change', handleFilterChange);
});

<div id="totalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:1000; overflow:auto; padding:20px; box-sizing:border-box;"><button id="closeTotalOverlay" style="position:absolute;top:10px;right:10px;" onclick="hideTotal()">Chiudi</button><h2>Totale Utilities</h2>
    <div id="totalKPI"></div><canvas id="totalChart"></canvas><div id="totalTable"></div></div>
<script>
function getTotalUtilitiesData() {
  var cons = new Array(12).fill(0);
  var bdg = new Array(12).fill(0);
  [DATA_EE, DATA_GAS, DATA_ACQUA].forEach(function(DATA) {
    for (var i = 0; i < 12; i++){
      cons[i] += DATA.total_cost[i];
      bdg[i] += DATA.total_cost_bdg[i];
    }
  });
  return {cons: cons, bdg: bdg};
}
function buildTotalChart() {
  var data = getTotalUtilitiesData();
  var real = data.cons.map(function(v,i){ return i<5 ? v : null; });
  var forecast = data.cons.map(function(v,i){ return i>=5 ? v : null; });
  var ctx = document.getElementById('totalChart').getContext('2d');
  if(window._totalChart) window._totalChart.destroy();
  window._totalChart = new Chart(ctx, {
    type: 'line', data: { labels: DATA_EE.months,
      datasets: [
        {label:'Reale', data:real, borderColor:'black'},
        {label:'Forecast', data:forecast, borderColor:'red'},
        {label:'BDG', data:data.bdg, borderColor:'blue', borderDash:[5,5]}
      ]
    }
  });
}
function buildTotalTable() {
  var data = getTotalUtilitiesData();
  var months = DATA_EE.months;
  var htmltbl = '<table><tr><th>Mese</th><th>Delta BDG</th></tr>';
  var total=0;
  for(var i=0;i<12;i++){
    var delta = data.cons[i]-data.bdg[i]; total+=delta;
    var color = i<5?'black':'red';
    htmltbl += '<tr><td style="color:'+color+'">'+months[i]+'</td>'+
              '<td style="color:'+color+'">'+delta.toFixed(0)+'</td></tr>';
  }
  htmltbl += '<tr><td><b>TOTALE</b></td><td><b>'+total.toFixed(0)+'</b></td></tr>';
  htmltbl += '</table>';
  document.getElementById('totalTable').innerHTML = htmltbl;
}
function showTotal(){ document.getElementById('totalOverlay').style.display='block'; buildTotalChart(); buildTotalTable(); }
function hideTotal(){ document.getElementById('totalOverlay').style.display='none'; }
</script>

<script>
function formatEuro(val) {
  var v = Math.round(val);
  if (typeof v.toLocaleString === 'function') {
    return v.toLocaleString('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:0});
  }
  var s = v.toString(), parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return '€' + parts.join(',');
}
function getTotalUtilitiesData() {
  var cons = new Array(12).fill(0);
  var bdg = new Array(12).fill(0);
  [DATA_EE, DATA_GAS, DATA_ACQUA].forEach(function(DATA) {
    for (var i = 0; i < 12; i++){
      cons[i] += DATA.total_cost[i];
      bdg[i]  += DATA.total_cost_bdg[i];
    }
  });
  return {cons:cons, bdg:bdg};
}
function buildTotalKPI() {
  var data = getTotalUtilitiesData();
  var totCost = data.cons.reduce(function(a,b){return a+b;},0);
  var totBDG  = data.bdg.reduce(function(a,b){return a+b;},0);
  var delta   = totCost - totBDG;
  var perc = totBDG !== 0 ? (delta / totBDG * 100) : 0;
  var html = '<p>Tot Cost: ' + formatEuro(totCost) + '</p>' +
            '<p>Tot BDG: ' + formatEuro(totBDG) + '</p>' +
            '<p>Delta: ' + formatEuro(delta) + '</p>' +
            '<p>% vs BDG: ' + perc.toFixed(1) + '%</p>';
  var cont = document.getElementById('totalKPI');
  if(cont) cont.innerHTML = html;
}
function buildTotalChart() {
  if(typeof window._totalChart !== 'undefined' && window._totalChart) {
    window._totalChart.destroy();
  }
  var data = getTotalUtilitiesData();
  var real = data.cons.map(function(v,i){ return i<5 ? v : null; });
  var forecast = data.cons.map(function(v,i){ return i>=5 ? v : null; });
  var ctx = document.getElementById('totalChart').getContext('2d');
  window._totalChart = new Chart(ctx, {
    type: 'line', data: { labels: DATA_EE.months,
      datasets: [
        {label:'Reale', data:real, borderColor:'black'},
        {label:'Forecast', data:forecast, borderColor:'red'},
        {label:'BDG', data:data.bdg, borderColor:'blue', borderDash:[5,5]}
      ]
    }
  });
}
function buildTotalTable() {
  var data = getTotalUtilitiesData();
  var months = DATA_EE.months;
  var htmltbl = '<table><tr><th>Mese</th><th>Delta BDG</th></tr>';
  var total = 0;
  for(var i=0;i<12;i++){
    var delta = data.cons[i]-data.bdg[i]; total += delta;
    var color = i<5?'black':'red';
    htmltbl += '<tr>' +
              '<td style="color:'+color+'">'+months[i]+'</td>' +
              '<td style="color:'+color+'">'+ formatEuro(delta) +'</td>' +
              '</tr>';
  }
  htmltbl += '<tr><td><b>TOTALE</b></td><td><b>'+ formatEuro(total) +'</b></td></tr>';
  htmltbl += '</table>';
  var cont = document.getElementById('totalTable');
  if(cont) cont.innerHTML = htmltbl;
}
function showTotal(){
  var ov = document.getElementById('totalOverlay');
  if(ov) ov.style.display='block';
  buildTotalKPI(); buildTotalChart(); buildTotalTable();
}
function hideTotal(){
  var ov = document.getElementById('totalOverlay');
  if(ov) ov.style.display='none';
}
document.addEventListener('DOMContentLoaded', function(){
  var btnTotal = document.getElementById('btn-total');
  if(btnTotal) btnTotal.onclick = showTotal;
  var btnClose = document.getElementById('closeTotalOverlay');
  if(btnClose) btnClose.onclick = hideTotal;
});
</script>

  if(navComp) navComp.style.display = 'none';

  resetSiteFilterToAll();
  // switch to default page EE
  switchPage('ee');
}

  currentCompany = null;

  document.getElementById('homeContainer').style.display = '';

  var navComp = document.querySelector('.company-buttons');

  var f = document.getElementById('siteFilter');
  if(!f) return;
  for(var i=0; i<f.options.length; i++){
    f.options[i].selected = true;
  }
}

var origSwitchPage = switchPage;
switchPage = function(page) {
  resetSiteFilterToAll();
  origSwitchPage(page);
};
